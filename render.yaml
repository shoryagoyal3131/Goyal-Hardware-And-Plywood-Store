services:
  - type: web
    name: hardware-plywood-shop
    runtime: python
    buildCommand: "cd hardware_shop_render_ready/hardware_shop && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "cd hardware_shop_render_ready/hardware_shop && gunicorn hardware_shop.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
