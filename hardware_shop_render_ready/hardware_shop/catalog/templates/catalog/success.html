{% extends "catalog/base.html" %}


{% block content %}


<div class="success-box">


    <div class="success-icon">

        ✓

    </div>


    <h1>

        Thank You, {{ customer_name }}!

    </h1>


    <p>

        Your enquiry has been saved successfully.

    </p>


    <p>

        You can now send your complete selection
        directly to our WhatsApp.

    </p>



    <a

        href="{{ whatsapp_url }}"

        target="_blank"

        class="button whatsapp big-button"

    >

        📱 Send Enquiry on WhatsApp

    </a>


    <br>
    <br>


    <a

        href="{% url 'home' %}"

        class="button"

    >

        Back to Home

    </a>


</div>


{% endblock %}
